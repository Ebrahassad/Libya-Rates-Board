name: libya_rates_board
description: >
  شاشة أسعار صرف ليبية كاملة للفول سكرين والتلفزيون، تدعم السعر الرسمي
  والسوق الموازي، التحديث التلقائي، العملة الرئيسية، التخزين المحلي، ووضع التلفزيون.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  html: ^0.15.7
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  wakelock_plus: ^1.8.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
