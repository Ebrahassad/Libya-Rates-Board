name: Build Libya Rates Board APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify formatting
        run: git diff --check

      - name: Build release APK
        env:
          FULUS_API_TOKEN: ${{ secrets.FULUS_API_TOKEN }}
        run: |
          if [ -n "$FULUS_API_TOKEN" ]; then
            flutter build apk --release \
              --dart-define="FULUS_API_TOKEN=$FULUS_API_TOKEN"
          else
            flutter build apk --release
          fi

      - name: Diagnose Android outputs
        if: always()
        run: |
          echo "===== BUILD DIRECTORY ====="
          find build -maxdepth 6 -type f 2>/dev/null | sort || true

          echo
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print 2>/dev/null | sort || true

          echo
          echo "===== AAB FILES ====="
          find . -type f -name "*.aab" -print 2>/dev/null | sort || true

          echo
          echo "===== GRADLE APK OUTPUTS ====="
          find android -type f \( -name "*.apk" -o -name "*.aab" \) -print 2>/dev/null | sort || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: libya-rates-board-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
